    <rect x="914" y="109" width="258" height="224"/><path d="M914 149H1172M961 149V333"/>
    <rect x="982" y="171" width="169" height="61"/><rect x="982" y="251" width="75" height="61"/><rect x="1076" y="251" width="75" height="61"/>
  </g>
  <g fill="#1F2BE0"><rect x="930" y="171" width="15" height="15"/><rect x="930" y="203" width="15" height="15" opacity=".6"/><rect x="930" y="235" width="15" height="15" opacity=".3"/><circle cx="933" cy="129" r="4"/><circle cx="948" cy="129" r="4"/></g>
  <text x="1043" y="369" fill="#1F2BE0" font-family="Segoe UI,Arial,sans-serif" font-size="12" text-anchor="middle" letter-spacing="2">ONE CALM PLACE FOR YOUR WEB</text>
