<svg xmlns="http://www.w3.org/2000/svg" width="940" height="240" viewBox="0 0 940 240" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Bobola</title>
  <desc id="desc">Bobola wordmark with a geometric B workspace symbol.</desc>
  <defs>
    <filter id="cobalt" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope="1.4" intercept="-0.2"/>
        <feFuncG type="linear" slope="1.4" intercept="-0.2"/>
        <feFuncB type="linear" slope="1.4" intercept="-0.2"/>
      </feComponentTransfer>
      <feColorMatrix type="matrix" values=".393 .769 .189 0 0 .349 .686 .168 0 0 .272 .534 .131 0 0 0 0 0 1 0"/>
      <feColorMatrix type="hueRotate" values="190"/>
      <feColorMatrix type="saturate" values="8"/>
