  <rect x="13" y="13" width="214" height="214" rx="55" stroke="#E7F4FF" stroke-opacity="0.16" stroke-width="2"/>
  <rect x="59" y="38" width="35" height="164" rx="17.5" fill="url(#mark)"/>
  <path d="M83 38H152C180 38 203 61 203 89C203 117 180 140 152 140H83V104H152C161 104 168 97 168 89C168 81 161 74 152 74H83V38Z" fill="url(#mark)"/>
  <path d="M83 101H152C180 101 203 124 203 152C203 180 180 203 152 203H83V167H152C161 167 168 160 168 152C168 144 161 137 152 137H83V101Z" fill="url(#mark)"/>
  <circle cx="83" cy="89" r="6" fill="url(#node)"/>
  <circle cx="83" cy="152" r="6" fill="url(#node)"/>
  <circle cx="187" cy="120" r="6" fill="url(#node)"/>
