name: Bug report
description: Report a reproducible Bobola issue.
title: "[Bug]: "
body:
  - type: input
    id: version
    attributes:
      label: Bobola and Windows versions
      placeholder: Bobola 1.0.1, Windows 11 x64
    validations:
      required: true
  - type: input
    id: service
    attributes:
      label: Affected service or feature
      placeholder: Service URL or settings area; omit private account details
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include relevant protection and keep-live settings.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Remove account details, cookies, tokens, and other private information.
